# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "test__bundle"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-f803e55c-ced8.cloud.databricks.com

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-f803e55c-ced8.cloud.databricks.com
      # We always use /Users/mschiwe@skeltech.de for all resources to make sure we only have a single copy.
      root_path: /Users/mschiwe@skeltech.de/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as mschiwe@skeltech.de in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: mschiwe@skeltech.de
